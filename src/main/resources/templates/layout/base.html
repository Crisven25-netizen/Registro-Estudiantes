<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  lang="es"
>
  <head>
    <meta charset="UTF-8" />
    <!-- Ajusta la página al ancho de la pantalla (celular, tablet o PC) -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title layout:title-pattern="$CONTENT_TITLE | Registro 11°">
      Registro 11°
    </title>
    <!-- Bootstrap 5: todos los estilos vienen de este archivo en internet (CDN) -->
    <link
      rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    />
  </head>
  <!-- ... continúa debajo de </head> -->
  <!-- d-flex flex-column: acomoda el contenido y pie uno debajo del otro
     min-vh-100: la página mide como mínimo el alto de la pantalla
     bg-light: fondo gris muy claro -->
  <body class="d-flex flex-column min-vh-100 bg-light">
    <!-- navbar: barra de menú | navbar-expand: los enlaces van en fila
       bg-dark: fondo oscuro | data-bs-theme="dark": letras claras -->
       
    <nav class="navbar navbar-expand bg-dark" data-bs-theme="dark">
      <!-- container: centra el contenido y deja márgenes a los lados -->
      <div class="container">
        <!-- navbar-brand: nombre del sitio, con letra más grande -->
        <a class="navbar-brand" href="@{/}">Registro</a>
        <!-- navbar-nav: grupo de enlaces | nav-link: cada enlace del menú -->
        <div class="navbar-nav">
          <a class="nav-link" th:href="@{/estudiantes}">Estudiantes</a>
          <a class="nav-link" th:href="@{/estudiantes/nuevo}"
            >Nuevo estudiante</a
          >
        </div>
      </div>
    </nav>
    <!-- ... continúa debajo de </nav> -->
    <!-- container: centrado | py-4: espacio (padding) arriba y abajo -->
    <main class="container py-4">
      <!-- ~: lugar en cada página hija donde aquí su contenido -->
      <div layout:fragment="contenido">
        <p>Contenido por defecto.</p>
      </div>
    </main>

    <!-- mt-auto: empuja el pie hasta abajo | py-3: espacio arriba y abajo
     bg-secondary: texto centrado | text-secondary: color gris | border-top: línea arriba -->
    <footer class="mt-auto py-3 text-center border-top">
      Undécimo año · Spring Boot con Thymeleaf y Bootstrap 5
    </footer>

    <!-- JavaScript de Bootstrap: lo necesitan los menús desplegables, alertas, etc. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
